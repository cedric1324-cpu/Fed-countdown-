<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown – Fed Statement (Amsterdam time)</title>
  <style>
    :root { --bg:#0b0f17; --fg:#e6e9ef; --muted:#9aa4b2; }
    html,body { height:100%; margin:0; }
    body {
      background: radial-gradient(1200px 800px at 50% 30%, #111826 0%, #0b0f17 60%);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card {
      width:min(780px, 92vw);
      border-radius:24px;
      padding:28px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.05);
    }
    h1 { margin:0 0 8px; font-size: clamp(22px, 2.2vw + 14px, 34px); letter-spacing:0.3px;}
    p  { margin:6px 0 18px; color: var(--muted); }
    .timer {
      font-variant-numeric: tabular-nums;
      display:flex; gap:16px; flex-wrap:wrap;
    }
    .tile {
      flex:1 1 140px; min-width:120px;
      background: rgba(255,255,255,0.06);
      border-radius:18px; padding:18px;
      text-align:center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }
    .num { font-size: clamp(42px, 5.6vw, 72px); font-weight:700; line-height:1; }
    .lab { margin-top:6px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-size:12px; }
    .meta { display:flex; gap:12px; align-items:center; justify-content:space-between; margin-top:18px; flex-wrap:wrap; }
    .badge { padding:6px 10px; border-radius:999px; background: rgba(255,255,255,.08); font-size:12px; }
    button {
      background: #2e7cf6; color:white; border:0; border-radius:10px; padding:10px 14px;
      font-weight:600; cursor:pointer;
      box-shadow: 0 8px 18px rgba(46,124,246,.35);
    }
    .small { font-size:12px; color: var(--muted); margin-top:10px; }
    .done { color: #7df69c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Countdown to Fed Statement (Amsterdam time)</h1>
    <p>Target: <strong>Wed 17 Sep 2025, 20:00</strong> CEST (UTC+2)</p>

    <div class="timer" id="timer" role="timer" aria-live="polite">
      <div class="tile"><div class="num" id="d">0</div><div class="lab">Days</div></div>
      <div class="tile"><div class="num" id="h">0</div><div class="lab">Hours</div></div>
      <div class="tile"><div class="num" id="m">0</div><div class="lab">Minutes</div></div>
      <div class="tile"><div class="num" id="s">0</div><div class="lab">Seconds</div></div>
    </div>

    <div class="meta">
      <span class="badge" id="status">Live</span>
      <div>
        <button id="add30">+30 min (switch to presser)</button>
        <button id="mute">🔔 Sound: Off</button>
      </div>
    </div>
    <div class="small">Tip: keep this tab open; it updates every second. When it hits zero, it will chime and turn green.</div>
  </div>

  <audio id="ding" preload="auto">
    <source src="data:audio/mp3;base64,//uQZAAAAAAAAAAAAAAAAAAAA... (silence)" type="audio/mpeg">
  </audio>

<script>
(function(){
  // Target as ISO with explicit timezone offset +02:00 for Amsterdam CEST
  let target = new Date("2025-09-17T20:00:00+02:00");
  const d=document;
  const el = {
    d: d.getElementById('d'),
    h: d.getElementById('h'),
    m: d.getElementById('m'),
    s: d.getElementById('s'),
    status: d.getElementById('status'),
    mute: d.getElementById('mute'),
    add30: d.getElementById('add30'),
    card: d.querySelector('.card'),
    ding: d.getElementById('ding')
  };
  let muted = true;

  function fmt(n){ return Math.max(0, n|0); }

  function tick(){
    const now = new Date();
    let diff = (target - now) / 1000; // seconds
    if (diff <= 0){
      el.d.textContent = 0;
      el.h.textContent = 0;
      el.m.textContent = 0;
      el.s.textContent = 0;
      el.status.textContent = "Event started";
      el.status.classList.add('done');
      el.card.style.boxShadow = "0 0 0 2px rgba(125,246,156,.6), 0 20px 50px rgba(125,246,156,.35)";
      if (!muted){ try { el.ding.play(); } catch(e){} }
      return;
    }
    const days = Math.floor(diff/86400); diff -= days*86400;
    const hours= Math.floor(diff/3600);  diff -= hours*3600;
    const mins = Math.floor(diff/60);    diff -= mins*60;
    const secs = Math.floor(diff);

    el.d.textContent = fmt(days);
    el.h.textContent = fmt(hours);
    el.m.textContent = fmt(mins);
    el.s.textContent = fmt(secs);
    requestAnimationFrame(tick);
  }

  // Controls
  el.mute.addEventListener('click', ()=>{
    muted = !muted;
    el.mute.textContent = muted ? "🔔 Sound: Off" : "🔔 Sound: On";
  });
  el.add30.addEventListener('click', ()=>{
    // Switch to the press conference at 20:30 CEST
    target = new Date("2025-09-17T20:30:00+02:00");
    el.status.textContent = "Live (press conference)";
    el.card.style.boxShadow = "0 10px 30px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.05)";
  });

  // Start
  tick();
})();
</script>
</body>
</html>
